flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/CairoBold.ttf
          weight: 700
        - asset: assets/fonts/CairoRegular.ttf
          weight: 400
    - family: SF
      fonts:
        - asset: assets/fonts/sf.ttf
          weight: 500
    - family: SYRIAN
      fonts:
        - asset: assets/fonts/arfonts.ttf
          weight: 500
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna.ttf
          weight: 500